<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HelpFy</title>
    <script>
      // SPA redirect trick for GitHub Pages
      // Encodes the current path/query/hash into a query parameter and
      // redirects to index.html so the React Router can handle it.
      var segmentCount = 0; // set to 1 if repo is at username.github.io/repo-name

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
