    <!-- SPA redirect: restore path encoded by 404.html -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        // Also handle the query-param technique used by 404.html
        var l = window.location;
        if (l.search[1] === "p" && l.search.indexOf("p=/") === 1) {
          var decoded = l.search.slice(1).split("&");
          var path = decoded[0].replace(/^p=/, "").replace(/~and~/g, "&");
          var query = decoded[1]
            ? decoded[1].replace(/^q=/, "").replace(/~and~/g, "&")
            : "";
          history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) +
              (path || "/") +
              (query ? "?" + query : "") +
              l.hash,
          );
        }
      })();
    </script>
